services:
  db:
    image: postgres:16-alpine
    container_name: capstone_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-capstone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-capstone_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-image_matching}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-capstone}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: